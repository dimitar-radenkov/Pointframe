name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - master

concurrency:
  group: cd-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    permissions:
      contents: write
      id-token: write # GitHub OIDC login to the MCP Registry
    env:
      SIGNING_CERT_B64: ${{ secrets.SIGNING_CERT_B64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore tools
        run: dotnet tool restore

      # Display version comes from version.json + commit height via Nerdbank.GitVersioning.
      # On a tag push the tag wins (e.g. v1.2.5 → publicRelease=true, no pre-release suffix).
      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $json = dotnet nbgv get-version --format json | ConvertFrom-Json
          $display = $json.NuGetPackageVersion   # e.g. "1.2.5"
          echo "display=$display" >> $env:GITHUB_OUTPUT

      - name: Check existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.display }}"
          $releaseJson = gh release view $tag --json isDraft,assets 2>&1
          if ($LASTEXITCODE -ne 0) {
            $errorText = $releaseJson -join "`n"
            if ($errorText -match '(?i)release not found|HTTP 404') {
              "skip=false" >> $env:GITHUB_OUTPUT
              exit 0
            }
            throw "Could not check release ${tag}: $errorText"
          }

          $release = $releaseJson | ConvertFrom-Json
          $expectedAssets = @(
            "Pointframe-${{ steps.version.outputs.display }}-x64-Setup.exe",
            "Pointframe.Cli-${{ steps.version.outputs.display }}-win-x64.zip",
            "Pointframe.Cli-${{ steps.version.outputs.display }}-win-x64.zip.sha256",
            'Pointframe.Cli-win-x64.zip',
            'Pointframe.Cli-win-x64.zip.sha256',
            "Pointframe.Mcp-${{ steps.version.outputs.display }}-win-x64.mcpb",
            "Pointframe.Mcp-${{ steps.version.outputs.display }}-win-x64.mcpb.sha256",
            "Pointframe.Mcp-${{ steps.version.outputs.display }}-win-x64.server.json",
            'Pointframe.Mcp-win-x64.mcpb',
            'Pointframe.Mcp-win-x64.mcpb.sha256'
          )
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $complete = -not $release.isDraft -and @($expectedAssets | Where-Object { $_ -notin $assetNames }).Count -eq 0
          if ($complete) {
            Write-Host "Release $tag is already published with all expected assets; skipping build and release steps."
            "skip=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Inject Application Insights connection string
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          $file = 'Pointframe/appsettings.json'
          $json = Get-Content $file | ConvertFrom-Json
          $json.ApplicationInsights.ConnectionString = '${{ secrets.APP_INSIGHTS_CONNECTION_STRING }}'
          $json | ConvertTo-Json -Depth 10 | Set-Content $file

      - name: Verify connection string was injected
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          $len = ((Get-Content 'Pointframe/appsettings.json' | ConvertFrom-Json).ApplicationInsights.ConnectionString).Length
          if ($len -eq 0) { Write-Error "APP_INSIGHTS_CONNECTION_STRING secret is empty or not set"; exit 1 }
          Write-Host "Connection string length: $len (secret injected successfully)"

      - name: Publish (self-contained single-file)
        if: steps.existing.outputs.skip != 'true'
        run: >-
          dotnet publish Pointframe/Pointframe.csproj
          /p:PublishProfile=win-x64
          --nologo

      - name: Download ffmpeg for MCP package
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $extractPath = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest `
            -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' `
            -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          $ffmpeg = Get-ChildItem $extractPath -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if ($null -eq $ffmpeg) { throw 'ffmpeg.exe was not found in the downloaded archive.' }
          "FFMPEG_PATH=$($ffmpeg.FullName)" >> $env:GITHUB_ENV

      - name: Build MCP release package
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          ./packaging/build-mcp-package.ps1 `
            -Version '${{ steps.version.outputs.display }}' `
            -FfmpegPath $env:FFMPEG_PATH

      - name: Build CLI release package
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          ./packaging/build-cli-package.ps1 `
            -Version '${{ steps.version.outputs.display }}'

      - name: Create stable CLI and MCP package aliases
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          $outputDirectory = 'packaging/output'
          $version = '${{ steps.version.outputs.display }}'
          $packages = @(
            @{
              Source = Join-Path $outputDirectory "Pointframe.Cli-$version-win-x64.zip"
              Destination = Join-Path $outputDirectory 'Pointframe.Cli-win-x64.zip'
            },
            @{
              Source = Join-Path $outputDirectory "Pointframe.Mcp-$version-win-x64.mcpb"
              Destination = Join-Path $outputDirectory 'Pointframe.Mcp-win-x64.mcpb'
            }
          )

          foreach ($package in $packages)
          {
            Copy-Item $package.Source $package.Destination -Force
            $sha256 = (Get-FileHash $package.Destination -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content "$($package.Destination).sha256" "$sha256  $(Split-Path $package.Destination -Leaf)" -Encoding utf8NoBOM
          }

      # Sign the published exe if a code-signing certificate is available.
      # Store your PFX as a base64 secret: SIGNING_CERT_B64
      # Store the PFX password as:          SIGNING_CERT_PASSWORD
      - name: Sign executable
        if: ${{ steps.existing.outputs.skip != 'true' && env.SIGNING_CERT_B64 != '' }}
        env:
          SIGNING_CERT_B64: ${{ env.SIGNING_CERT_B64 }}
          SIGNING_CERT_PASSWORD: ${{ env.SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = [System.Convert]::FromBase64String($env:SIGNING_CERT_B64)
          $pfxPath = Join-Path $env:TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $pfx)
          try {
            $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
              Sort-Object -Property FullName -Descending | Select-Object -First 1).FullName
            $exePath = 'Pointframe\bin\publish\win-x64\Pointframe.exe'
            & $signtool sign /fd SHA256 /p $env:SIGNING_CERT_PASSWORD /f $pfxPath /tr http://timestamp.digicert.com /td SHA256 $exePath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Install Inno Setup 6
        if: steps.existing.outputs.skip != 'true'
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        if: steps.existing.outputs.skip != 'true'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc `
            /DAppVersion=${{ steps.version.outputs.display }} `
            /O"installer\output" `
            installer\Pointframe.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer
        if: ${{ steps.existing.outputs.skip != 'true' && env.SIGNING_CERT_B64 != '' }}
        env:
          SIGNING_CERT_B64: ${{ env.SIGNING_CERT_B64 }}
          SIGNING_CERT_PASSWORD: ${{ env.SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = [System.Convert]::FromBase64String($env:SIGNING_CERT_B64)
          $pfxPath = Join-Path $env:TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $pfx)
          try {
            $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
              Sort-Object -Property FullName -Descending | Select-Object -First 1).FullName
            $setupPath = "installer\output\Pointframe-${{ steps.version.outputs.display }}-x64-Setup.exe"
            & $signtool sign /fd SHA256 /p $env:SIGNING_CERT_PASSWORD /f $pfxPath /tr http://timestamp.digicert.com /td SHA256 $setupPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload installer artifact
        if: steps.existing.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Pointframe-${{ steps.version.outputs.display }}-x64-Setup
          path: installer/output/Pointframe-${{ steps.version.outputs.display }}-x64-Setup.exe

      - name: Create GitHub Release
        if: steps.existing.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.display }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          files: |
            installer/output/Pointframe-${{ steps.version.outputs.display }}-x64-Setup.exe
            packaging/output/Pointframe.Cli-${{ steps.version.outputs.display }}-win-x64.zip
            packaging/output/Pointframe.Cli-${{ steps.version.outputs.display }}-win-x64.zip.sha256
            packaging/output/Pointframe.Cli-win-x64.zip
            packaging/output/Pointframe.Cli-win-x64.zip.sha256
            packaging/output/Pointframe.Mcp-${{ steps.version.outputs.display }}-win-x64.mcpb
            packaging/output/Pointframe.Mcp-${{ steps.version.outputs.display }}-win-x64.mcpb.sha256
            packaging/output/Pointframe.Mcp-${{ steps.version.outputs.display }}-win-x64.server.json
            packaging/output/Pointframe.Mcp-win-x64.mcpb
            packaging/output/Pointframe.Mcp-win-x64.mcpb.sha256
          body: |
            Pointframe ${{ steps.version.outputs.display }}

            - Installer refresh and maintenance release.
            - Includes a standalone Pointframe CLI for whole-monitor screenshots.
            - Includes the Pointframe MCPB stdio server bundle and registry metadata.
            - For the full list of commits, see Compare in this release page.

      # Runs after the release exists because server.json pins the MCPB release URL and SHA-256.
      # OIDC proves ownership of the io.github.dimitar-radenkov/* namespace; no secret is needed.
      - name: Publish MCP server to the MCP Registry
        if: ${{ steps.existing.outputs.skip == 'true' || success() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $publisherVersion = 'v1.8.1'
          $publisherArchive = Join-Path $env:RUNNER_TEMP 'mcp-publisher.tar.gz'
          Invoke-WebRequest `
            -Uri "https://github.com/modelcontextprotocol/registry/releases/download/$publisherVersion/mcp-publisher_windows_amd64.tar.gz" `
            -OutFile $publisherArchive
          tar -xzf $publisherArchive -C $env:RUNNER_TEMP mcp-publisher.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publisher = Join-Path $env:RUNNER_TEMP 'mcp-publisher.exe'

          $serverJson = 'packaging/output/Pointframe.Mcp-${{ steps.version.outputs.display }}-win-x64.server.json'
          if ('${{ steps.existing.outputs.skip }}' -eq 'true') {
            gh release download "v${{ steps.version.outputs.display }}" --pattern '*server.json' --dir packaging/output --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $serverJson)) { throw "Release server metadata was not found: $serverJson" }
          & $publisher validate $serverJson
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $publisher login github-oidc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publishOutput = & $publisher publish $serverJson 2>&1
          $publishExitCode = $LASTEXITCODE
          $publishOutput | ForEach-Object { Write-Host $_ }
          if ($publishExitCode -ne 0) {
            $publishText = $publishOutput -join "`n"
            if ($publishText -match '(?i)cannot publish duplicate version') {
              Write-Host '::notice::MCP Registry already has this version; treating the duplicate publish as success.'
              exit 0
            }
            else {
              exit $publishExitCode
            }
          }

      - name: Upload release version artifact
        shell: pwsh
        run: |
          '${{ steps.version.outputs.display }}' | Set-Content release-version.txt -NoNewline -Encoding utf8

      - name: Publish release version artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-version
          path: release-version.txt
