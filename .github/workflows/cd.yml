name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

concurrency:
  group: cd-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    permissions:
      contents: write
      id-token: write
    env:
      SIGNING_CERT_B64: ${{ secrets.SIGNING_CERT_B64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore tools
        run: dotnet tool restore

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $json = dotnet nbgv get-version --format json | ConvertFrom-Json
          $display = $json.NuGetPackageVersion
          "display=$display" >> $env:GITHUB_OUTPUT

      # Plan before any build. The complete paged release listing is required for per-train baselines and stale reruns.
      - name: Compute and gate release plan
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = '${{ github.event.workflow_run.head_sha }}'
          New-Item -ItemType Directory -Path release-receipt -Force | Out-Null
          $all = [System.Collections.Generic.List[object]]::new()
          for ($page = 1; $page -le 50; $page++) {
            $output = gh api "repos/${{ github.repository }}/releases?per_page=100&page=$page" 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Could not list releases (page $page): $($output -join ' ')" }
            $chunk = @(($output -join "`n") | ConvertFrom-Json)
            foreach ($release in $chunk) { $all.Add($release) }
            if ($chunk.Count -lt 100) { break }
            if ($page -eq 50) { throw 'More than 50 pages of releases; increase the explicit release listing cap.' }
          }
          ConvertTo-Json -InputObject $all.ToArray() -Depth 10 | Set-Content release-receipt/releases.json -Encoding utf8NoBOM
          $security = $false
          $pulls = gh api "repos/${{ github.repository }}/commits/$sha/pulls" 2>$null
          if ($LASTEXITCODE -eq 0) { $security = @(($pulls -join "`n") | ConvertFrom-Json | ForEach-Object { $_.labels } | Where-Object { $_.name -eq 'security' }).Count -gt 0 }
          ./scripts/release-impact.ps1 -Base "$sha~1" -Head $sha -CurrentVersion '${{ steps.version.outputs.display }}' -ReleasesFile release-receipt/releases.json -PlanOut release-receipt/plan.json -Security:$security
          if ($LASTEXITCODE -eq 3) { throw 'Release plan contains an unclassified path; refusing to build.' }
          if ($LASTEXITCODE -ne 0) { throw "Release plan failed with exit $LASTEXITCODE; refusing to build." }
          $plan = Get-Content release-receipt/plan.json -Raw | ConvertFrom-Json
          foreach ($train in @('desktop', 'agent')) {
            if ($plan.perTrain.$train.stale) { Write-Host "::notice::v${{ steps.version.outputs.display }} is stale for $train; published $($plan.perTrain.$train.baseline) already exists. No release or Latest change will be made for that train." }
          }
          $desktop = [bool]$plan.perTrain.desktop.selected
          $agent = [bool]$plan.perTrain.agent.selected
          $selectedTrains = [System.Collections.Generic.List[string]]::new()
          if ($desktop) { $selectedTrains.Add('desktop') }
          if ($agent) { $selectedTrains.Add('agent') }
          $trains = $selectedTrains -join ','
          "desktop=$($desktop.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "agent=$($agent.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "trains=$trains" >> $env:GITHUB_OUTPUT
          Write-Host "Release trains selected: $(if ($trains) { $trains } else { 'none' })"

      - name: Inject desktop telemetry connection string
        if: steps.plan.outputs.desktop == 'true'
        shell: pwsh
        run: |
          $file = 'Pointframe/appsettings.json'
          $json = Get-Content $file | ConvertFrom-Json
          $json.ApplicationInsights.ConnectionString = '${{ secrets.APP_INSIGHTS_CONNECTION_STRING }}'
          $json | ConvertTo-Json -Depth 10 | Set-Content $file
          $length = $json.ApplicationInsights.ConnectionString.Length
          if ($length -eq 0) { throw 'APP_INSIGHTS_CONNECTION_STRING secret is empty or not set.' }

      - name: Inject agent telemetry connection string
        if: steps.plan.outputs.agent == 'true'
        shell: pwsh
        run: |
          $file = 'Pointframe.Telemetry/telemetry.json'
          $json = Get-Content $file | ConvertFrom-Json
          $json.ApplicationInsights.ConnectionString = '${{ secrets.APP_INSIGHTS_CONNECTION_STRING }}'
          $json | ConvertTo-Json -Depth 10 | Set-Content $file
          if ($json.ApplicationInsights.ConnectionString.Length -eq 0) { throw 'APP_INSIGHTS_CONNECTION_STRING is empty for the agent packages.' }

      - name: Publish desktop application
        if: steps.plan.outputs.desktop == 'true'
        run: dotnet publish Pointframe/Pointframe.csproj /p:PublishProfile=win-x64 --nologo

      - name: Download ffmpeg for MCP package
        if: steps.plan.outputs.agent == 'true'
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $extractPath = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-9.0.zip' -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          $ffmpeg = Get-ChildItem $extractPath -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if ($null -eq $ffmpeg) { throw 'ffmpeg.exe was not found in the downloaded archive.' }
          & $ffmpeg.FullName -hide_banner -loglevel error -f lavfi -i 'testsrc=size=64x64:rate=10' -thread_queue_size 512 -f lavfi -i anullsrc -map 0:v:0 -map 1:a:0 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -t 1 -f null -
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg rejected the recording arguments (exit $LASTEXITCODE)." }
          "FFMPEG_PATH=$($ffmpeg.FullName)" >> $env:GITHUB_ENV

      - name: Build MCP release package
        if: steps.plan.outputs.agent == 'true'
        shell: pwsh
        run: ./packaging/build-mcp-package.ps1 -Version '${{ steps.version.outputs.display }}' -FfmpegPath $env:FFMPEG_PATH

      - name: Build CLI release package
        if: steps.plan.outputs.agent == 'true'
        shell: pwsh
        run: ./packaging/build-cli-package.ps1 -Version '${{ steps.version.outputs.display }}'

      - name: Sign desktop executable
        if: ${{ steps.plan.outputs.desktop == 'true' && env.SIGNING_CERT_B64 != '' }}
        shell: pwsh
        run: |
          $pfx = [Convert]::FromBase64String($env:SIGNING_CERT_B64)
          $pfxPath = Join-Path $env:TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $pfx)
          try {
            $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
            & $signtool sign /fd SHA256 /p $env:SIGNING_CERT_PASSWORD /f $pfxPath /tr http://timestamp.digicert.com /td SHA256 'Pointframe\bin\publish\win-x64\Pointframe.exe'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue }

      - name: Install Inno Setup 6
        if: steps.plan.outputs.desktop == 'true'
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        if: steps.plan.outputs.desktop == 'true'
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc /DAppVersion=${{ steps.version.outputs.display }} /O"installer\output" installer\Pointframe.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer
        if: ${{ steps.plan.outputs.desktop == 'true' && env.SIGNING_CERT_B64 != '' }}
        shell: pwsh
        run: |
          $pfx = [Convert]::FromBase64String($env:SIGNING_CERT_B64)
          $pfxPath = Join-Path $env:TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $pfx)
          try {
            $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
            $setupPath = "installer\output\Pointframe-${{ steps.version.outputs.display }}-x64-Setup.exe"
            & $signtool sign /fd SHA256 /p $env:SIGNING_CERT_PASSWORD /f $pfxPath /tr http://timestamp.digicert.com /td SHA256 $setupPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue }

      - name: Read the previous Latest release
        id: previous-latest
        if: steps.plan.outputs.desktop == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $output = gh api "repos/${{ github.repository }}/releases/latest" 2>&1
          if ($LASTEXITCODE -ne 0) {
            $errorText = $output -join "`n"
            if ($errorText -match 'HTTP 404') { "tag=" >> $env:GITHUB_OUTPUT; exit 0 }
            throw "Could not read the previous Latest release: $errorText"
          }
          "tag=$((($output -join "`n") | ConvertFrom-Json).tag_name)" >> $env:GITHUB_OUTPUT

      - name: Create, validate, and publish selected release trains
        id: publish
        if: ${{ success() && steps.plan.outputs.trains != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/publish-release.ps1 -Version '${{ steps.version.outputs.display }}' -Trains '${{ steps.plan.outputs.trains }}' -Commit '${{ github.event.workflow_run.head_sha }}' -Repository '${{ github.repository }}' -ResultOut release-receipt/publication.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content release-receipt/publication.json -Raw | ConvertFrom-Json
          "desktop_state=$($result.trains.desktop)" >> $env:GITHUB_OUTPUT
          "agent_state=$($result.trains.agent)" >> $env:GITHUB_OUTPUT
          "alias_source_version=$($result.aliasSourceVersion)" >> $env:GITHUB_OUTPUT
          "published=$($result.published.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "skipped_complete=$($result.skippedComplete.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Prove make_latest on create
        if: ${{ steps.publish.outputs.published == 'true' && steps.plan.outputs.desktop == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = '${{ steps.previous-latest.outputs.tag }}'
          if (-not $previous) { New-Item -ItemType Directory -Path release-receipt -Force | Out-Null; '{"status":"not-run","message":"no previous Latest release"}' | Set-Content release-receipt/create.json; exit 0 }
          ./scripts/check-latest-release.ps1 -Repository '${{ github.repository }}' -Expect $previous -ResultOut release-receipt/create.json
          exit $LASTEXITCODE

      - name: Prove make_latest on update
        if: ${{ steps.publish.outputs.published == 'true' && steps.plan.outputs.desktop == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = '${{ steps.previous-latest.outputs.tag }}'
          if (-not $previous) { New-Item -ItemType Directory -Path release-receipt -Force | Out-Null; '{"status":"not-run","message":"no previous Latest release"}' | Set-Content release-receipt/update.json; exit 0 }
          ./scripts/check-latest-release.ps1 -Repository '${{ github.repository }}' -Update 'v${{ steps.version.outputs.display }}' -MakeLatest false -ResultOut release-receipt/update.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check-latest-release.ps1 -Repository '${{ github.repository }}' -Expect $previous -ResultOut release-receipt/update.json
          exit $LASTEXITCODE

      - name: Promote desktop release to Latest
        id: promote
        if: ${{ !cancelled() && (steps.publish.outputs.desktop_state == 'published' || steps.publish.outputs.desktop_state == 'complete') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/check-latest-release.ps1 -Repository '${{ github.repository }}' -Promote 'v${{ steps.version.outputs.display }}' -ResultOut release-receipt/promote.json
          exit $LASTEXITCODE

      - name: Repair and check Latest
        id: latest-check
        if: ${{ !cancelled() && (steps.publish.outputs.desktop_state == 'published' || steps.publish.outputs.desktop_state == 'complete') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/check-latest-release.ps1 -Repository '${{ github.repository }}' -Repair -ResultOut release-receipt/latest.json
          exit $LASTEXITCODE

      - name: Publish MCP server to the MCP Registry
        if: ${{ success() && (steps.publish.outputs.agent_state == 'published' || steps.publish.outputs.agent_state == 'complete') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $publisherVersion = 'v1.8.1'
          $publisherArchive = Join-Path $env:RUNNER_TEMP 'mcp-publisher.tar.gz'
          Invoke-WebRequest -Uri "https://github.com/modelcontextprotocol/registry/releases/download/$publisherVersion/mcp-publisher_windows_amd64.tar.gz" -OutFile $publisherArchive
          tar -xzf $publisherArchive -C $env:RUNNER_TEMP mcp-publisher.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publisher = Join-Path $env:RUNNER_TEMP 'mcp-publisher.exe'
          $serverJson = "packaging/output/Pointframe.Mcp-${{ steps.version.outputs.display }}-win-x64.server.json"
          if ('${{ steps.publish.outputs.agent_state }}' -eq 'complete') {
            gh release download "v${{ steps.version.outputs.display }}" --pattern '*server.json' --dir packaging/output --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $serverJson)) { throw "Release server metadata was not found: $serverJson" }
          & $publisher validate $serverJson
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $publisher login github-oidc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publishOutput = & $publisher publish $serverJson 2>&1
          $publishExitCode = $LASTEXITCODE
          $publishOutput | ForEach-Object { Write-Host $_ }
          if ($publishExitCode -ne 0) {
            if (($publishOutput -join "`n") -match '(?i)cannot publish duplicate version') { Write-Host '::notice::MCP Registry already has this version; treating the duplicate publish as success.'; exit 0 }
            exit $publishExitCode
          }

      - name: Write release receipt
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $trains = '${{ steps.plan.outputs.trains }}'
          if (-not $trains) { $publication = 'published' }
          elseif ('${{ steps.publish.outcome }}' -eq 'success') { $publication = 'published' }
          elseif (Test-Path release-receipt/publication.json) { $publication = 'draft' }
          else { $publication = 'failed' }
          ./scripts/write-release-receipt.ps1 -Version '${{ steps.version.outputs.display }}' -Commit '${{ github.event.workflow_run.head_sha }}' -Repository '${{ github.repository }}' -Trains $trains -Publication $publication -AliasSourceVersion '${{ steps.publish.outputs.alias_source_version }}' -StateFile release-receipt/publication.json -ProofCreate release-receipt/create.json -ProofUpdate release-receipt/update.json -PromoteResult release-receipt/promote.json -LatestResult release-receipt/latest.json -PlanFile release-receipt/plan.json -Out release-receipt/release-plan.json
          exit $LASTEXITCODE

      - name: Publish release plan receipt artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: release-receipt/release-plan.json
          if-no-files-found: error
