name: Script self-tests (daily)

# The full script self-test set, including the full (about 25 minutes) package.ps1 one; pull requests run its quick
# variant, and only when scripts/ is touched. Deliberately not named "CI": cd.yml follows workflow_run of "CI" and would cut a release for this run.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  script-selftests:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Script self-tests (all)
        shell: pwsh
        run: |
          ./scripts/test-scripts.ps1 -All -ResultFile artifacts/script-selftests/result.json
          exit $LASTEXITCODE

      - name: Upload script self-test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: script-selftest-timings-${{ github.run_id }}
          path: artifacts/script-selftests/result.json
          if-no-files-found: ignore
