name: Plugin Pin

# After every successful CD run (a release exists), opens a pull request that moves the Claude plugin's pinned server to
# that release: only plugin/pointframe/server.lock.json and the version in plugin/pointframe/.claude-plugin/plugin.json
# change. CI ignores master pushes that touch only plugin/**, so merging that pull request cuts no release and the loop stops.
#
# Pull requests created with the default GITHUB_TOKEN do not start other workflows, so the required checks would never
# report and the pull request could not auto-merge. When the repository secret PLUGIN_PIN_TOKEN (a token that may write
# contents and pull requests) exists, it is used instead. Without it the pull request is still opened with auto-merge
# requested, and a maintainer starts the checks by closing and reopening it. The repository setting "Allow GitHub Actions to
# create and approve pull requests" must be on for the default token to open it.

on:
  workflow_run:
    workflows: ["CD"]
    types: [completed]
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: Release version to pin. Leave blank to use the version of the latest CD run.
        required: false
        type: string

concurrency:
  group: plugin-pin
  cancel-in-progress: false

jobs:
  pin:
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.PLUGIN_PIN_TOKEN || github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          token: ${{ secrets.PLUGIN_PIN_TOKEN || github.token }}

      - name: Get release version
        id: release
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
            $destination = Join-Path $env:RUNNER_TEMP 'release-version'
            gh run download '${{ github.event.workflow_run.id }}' --repo '${{ github.repository }}' --name release-version --dir $destination
            if ($LASTEXITCODE -ne 0) { throw 'The CD run has no release-version artifact.' }
            $version = (Get-Content (Join-Path $destination 'release-version.txt') -Raw).Trim()
          }
          if ($version -notmatch '^[0-9]+(\.[0-9]+){2,3}$') { throw "Not a release version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Update the pin
        id: pin
        shell: pwsh
        run: |
          ./scripts/update-plugin-pin.ps1 -Version '${{ steps.release.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Open the pull request and request auto-merge
        if: steps.pin.outputs.changed == 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $branch = "plugin-pin/v$version"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c $branch
          git add plugin/pointframe/server.lock.json plugin/pointframe/.claude-plugin/plugin.json
          git commit -m "Pin the Claude plugin to Pointframe $version"
          git push origin $branch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $body = "Moves the Claude plugin to the Pointframe $version MCP server. Only plugin/pointframe/server.lock.json and the version in plugin.json change; CI ignores master pushes that touch only plugin/**, so merging this cuts no release."
          gh pr create --base master --head $branch --title "Pin the Claude plugin to Pointframe $version" --body $body
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh pr merge $branch --auto --squash
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # An older pin pull request that is still open is superseded by this one.
          $open = gh pr list --state open --search 'head:plugin-pin/' --json number,headRefName | ConvertFrom-Json
          foreach ($pr in $open) {
            if ($pr.headRefName -ne $branch) {
              gh pr close $pr.number --delete-branch --comment "Superseded by the pin to $version."
            }
          }
          exit 0
