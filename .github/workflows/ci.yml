name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Feature branches run CI once, through their pull request. A new push to a pull request cancels the
# older run; a master push has its own group (its SHA), so it is neither cancelled nor dropped from a queue, because CD waits for it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Two parallel jobs of roughly equal length; both are required checks. unit-tests builds and tests, package-checks
  # publishes the shipped executables and runs the repository checks. The NuGet cache is saved by unit-tests only and
  # only restored by package-checks; it excludes the win-x64 runtime packs, which the published projects download.
  unit-tests:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            !~/.nuget/packages/microsoft.netcore.app.runtime.*
            !~/.nuget/packages/microsoft.windowsdesktop.app.runtime.*
            !~/.nuget/packages/microsoft.aspnetcore.app.runtime.*
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', 'global.json', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        # The test project references every product project; no need to restore the automation tests or the fixture.
        run: dotnet restore Pointframe.Tests/Pointframe.Tests.csproj

      - name: Build
        run: dotnet build Pointframe.Tests/Pointframe.Tests.csproj --no-restore --configuration Release

      - name: MCP contract and discovery tests
        run: >
          dotnet test Pointframe.Tests/Pointframe.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --verbosity normal
          --filter "FullyQualifiedName~Mcp|FullyQualifiedName~DesktopTesting"

      - name: Test with coverage
        # Hosted CI stays on the unit-test lane only.
        # DesktopAutomation and InstallerSmoke run outside this workflow.
        run: >
          dotnet test Pointframe.Tests/Pointframe.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --verbosity normal
          --filter "Category!=Integration"
          --collect:"XPlat Code Coverage"
          --results-directory coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 3

  package-checks:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet packages from cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.nuget/packages
            !~/.nuget/packages/microsoft.netcore.app.runtime.*
            !~/.nuget/packages/microsoft.windowsdesktop.app.runtime.*
            !~/.nuget/packages/microsoft.aspnetcore.app.runtime.*
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets', 'global.json', 'dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        # Only what is published or formatted here; the test project is restored and built by unit-tests.
        shell: pwsh
        run: |
          foreach ($project in 'Pointframe/Pointframe.csproj', 'Pointframe.Mcp/Pointframe.Mcp.csproj', 'Pointframe.Cli/Pointframe.Cli.csproj')
          {
            dotnet restore $project
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Format check
        run: dotnet format Pointframe/Pointframe.csproj --verify-no-changes --no-restore

      - name: Publish MCP server
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'Pointframe.Mcp\bin\publish\win-x64'
          dotnet publish Pointframe.Mcp/Pointframe.Mcp.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=false `
            /p:EnableCompressionInSingleFile=true `
            /p:PublishTrimmed=false `
            /p:PublishDir="$publishDir\" `
            --no-restore `
            --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish CLI
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'Pointframe.Cli\bin\publish\win-x64'
          dotnet publish Pointframe.Cli/Pointframe.Cli.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=false `
            /p:EnableCompressionInSingleFile=true `
            /p:PublishTrimmed=false `
            /p:PublishDir="$publishDir\" `
            --no-restore `
            --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: MCP stdio smoke test
        shell: pwsh
        run: >
          ./packaging/test-mcp-stdio.ps1
          -ExecutablePath Pointframe.Mcp/bin/publish/win-x64/Pointframe.Mcp.exe

      - name: Knowledge base check
        # Fails on a broken KB link or path, a tracked file with no File map row,
        # or a telemetry event or smoke test with no feature row.
        shell: pwsh
        run: ./scripts/kb.ps1 check -NoFix

      - name: Workflow script check
        # Fails when a pwsh run: block in .github/workflows does not parse as PowerShell.
        shell: pwsh
        run: |
          ./scripts/check-workflow-scripts.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check-workflow-scripts.ps1
          exit $LASTEXITCODE

      - name: Agent discovery check
        # Fails when the agent page, llms.txt, or the directory drafts drift from the README, packaging, or release assets.
        shell: pwsh
        run: |
          ./scripts/check-agent-discovery.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check-agent-discovery.ps1
          exit $LASTEXITCODE

  # Not a required check: a Codecov outage or slow upload must not delay or fail a merge.
  coverage:
    needs: unit-tests
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/**/coverage.cobertura.xml
          fail_ci_if_error: false
