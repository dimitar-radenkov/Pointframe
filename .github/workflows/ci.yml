name: CI

on:
  push:
    branches: [ master, "feature/**", "fix/**" ]
  pull_request:
    branches: [ master ]

jobs:
  unit-tests:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore Pointframe.slnx

      - name: Build
        run: dotnet build Pointframe.Tests/Pointframe.Tests.csproj --no-restore --configuration Release

      - name: Publish MCP server
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'Pointframe.Mcp\bin\publish\win-x64'
          dotnet publish Pointframe.Mcp/Pointframe.Mcp.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=true `
            /p:EnableCompressionInSingleFile=true `
            /p:PublishTrimmed=false `
            /p:PublishDir="$publishDir\" `
            --no-restore `
            --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: MCP stdio smoke test
        shell: pwsh
        run: >
          ./packaging/test-mcp-stdio.ps1
          -ExecutablePath Pointframe.Mcp/bin/publish/win-x64/Pointframe.Mcp.exe

      - name: Format check
        run: dotnet format Pointframe/Pointframe.csproj --verify-no-changes --no-restore

      - name: Test with coverage
        # Hosted CI stays on the unit-test lane only.
        # DesktopAutomation and InstallerSmoke run outside this workflow.
        run: >
          dotnet test Pointframe.Tests/Pointframe.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --verbosity normal
          --filter "Category!=Integration"
          --collect:"XPlat Code Coverage"
          --results-directory coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/**/coverage.cobertura.xml
