name: Desktop Automation

on:
  workflow_dispatch:
    inputs:
      desktop_automation_ack:
        description: Type true only after confirming this Windows account or machine is safe for automation
        required: true
        type: string

concurrency:
  group: desktop-automation
  cancel-in-progress: false

jobs:
  desktop-smoke:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Run required desktop regression selection
        shell: pwsh
        env:
          POINTFRAME_DESKTOP_TEST_ACK: ${{ inputs.desktop_automation_ack }}
        run: |
          if ($env:POINTFRAME_DESKTOP_TEST_ACK -ne 'true') {
            throw 'Explicit desktop takeover acknowledgement is required.'
          }
          pwsh scripts/desktop-tests.ps1

      - name: Upload desktop evidence
        if: ${{ always() && vars.POINTFRAME_UPLOAD_DESKTOP_EVIDENCE == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: pointframe-desktop-evidence
          path: artifacts/desktop-tests
          if-no-files-found: ignore
